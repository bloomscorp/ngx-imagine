name: Release

# Triggered by a version tag (v0.1.0). Every gate runs again on a fresh
# checkout, then the library is published from dist/ with an npm trusted
# publisher (OIDC) and provenance: no NPM_TOKEN secret. The trusted publisher on
# npm must name this repository and this workflow file exactly (release.yml),
# or the upload fails with E404 after provenance is signed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the GitHub release
  id-token: write      # mints the OIDC token npm trusts, and signs provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          # Required so npm knows which registry the OIDC token is for. No
          # NODE_AUTH_TOKEN is set anywhere.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles npm 11, so this
      # checks rather than upgrades.
      - name: npm is new enough for trusted publishing
        run: |
          npm -v
          node -e "
            const [a, b, c] = process.argv[1].split('.').map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error('npm ' + process.argv[1] + ' is older than 11.5.1, which trusted publishing needs');
              process.exit(1);
            }" "$(npm -v)"

      # Built and tested against the published core, never a local copy.
      - name: The core comes from npm
        run: |
          if node -e "process.exit(String(require('./package.json').devDependencies['@bloomscorp/imagine.js']).startsWith('file:') ? 0 : 1)"; then
            echo "::error::package.json uses file:../imagine.js. Switch to the published core first (RELEASING.md)."
            exit 1
          fi

      - run: npm ci

      # The same gates as CI.
      - name: Build the library
        run: npm run build

      - name: Type-check the library and its tests
        run: npm run lint

      - name: Test, with coverage thresholds
        run: npm run test:coverage

      - name: Library and workspace versions agree
        run: npm run check-version

      - name: Packaging gate
        run: npm run verify:package

      - name: Every Angular major in the peer range links and compiles it
        run: npm run verify:compat

      # The tag, the workspace and the published manifest must all agree.
      - name: Check the tag matches the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./dist/bloomscorp/ngx-imagine/package.json').version")"
          echo "tag=$TAG published=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match the built package's version $PKG"
            exit 1
          fi

      # From dist/, which is the package: ng-packagr's output with the library's
      # own package.json. A prerelease (0.2.0-rc.1) goes to the `next` dist-tag.
      # A version already on npm (the one-off manual first publish, RELEASING.md)
      # is not published again; the GitHub release is still made.
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "@bloomscorp/ngx-imagine@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@bloomscorp/ngx-imagine@$VERSION is already on npm; not publishing it again."
            exit 0
          fi
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          npm publish ./dist/bloomscorp/ngx-imagine --provenance --access public --tag "$DIST_TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRERELEASE \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to npm as \`@bloomscorp/ngx-imagine@$VERSION\`.

          \`\`\`bash
          npm install @bloomscorp/ngx-imagine@$VERSION @bloomscorp/imagine.js
          \`\`\`

          See CHANGELOG.md for what changed."

      - name: Summary
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            echo "### Published \`@bloomscorp/ngx-imagine@$V\`"
            echo
            echo "- npm: https://www.npmjs.com/package/@bloomscorp/ngx-imagine/v/$V"
            echo "- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
